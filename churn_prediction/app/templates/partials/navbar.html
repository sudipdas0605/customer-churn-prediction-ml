<nav class="navbar">
    <div class="navbar-inner">
        <a href="{{ url_for('pages.index') }}" class="navbar-brand">
            <div class="brand-icon">&#10003;</div>
            ChurnGuard
            <span class="brand-dot"></span>
        </a>

        <button class="navbar-toggle" type="button" data-nav-toggle
                aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>

        <div class="navbar-center" data-nav-menu>
            <a href="{{ url_for('pages.index') }}"
               class="{{ 'active' if active_page == 'home' else '' }}">Home</a>
            {% for domain in nav_domains %}
            <a href="{{ url_for('pages.form', domain=domain.key) }}"
               class="{{ 'active' if active_page == domain.key else '' }}">{{ domain.label }}</a>
            {% endfor %}
        </div>

        <a href="{{ url_for('pages.contact') }}"
           class="navbar-cta{{ ' active' if active_page == 'contact' else '' }}">Contact Us</a>
    </div>
</nav>
